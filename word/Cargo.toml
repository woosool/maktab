[workspace]
resolver = "2"
members = ["engine", "app"]

[profile.dev.package."*"]
opt-level = 2
# Libraries without debug info keep build folders small (our own crates keep theirs).
debug = false

# Release builds: optimized across crates and stripped of debug symbols (a much smaller program).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
