[package]
name = "woffice-translate"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline translation (OPUS-MT Marian models in ONNX) for Qalam and Sard."

[workspace]

[dependencies]
tract-onnx = "0.23"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
ureq = "3.5"
