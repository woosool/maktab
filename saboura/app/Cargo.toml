[package]
name = "saboura-app"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Saboura (سبورة): a desktop whiteboard."

[dependencies]
eframe = "0.37.0"
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
base64 = "0.22"
qalam-kit = { version = "0.1.0", path = "../../kit" }
rfd = "0.17.2"
saboura-engine = { version = "0.1.0", path = "../engine" }
serde_json = "1"
arboard = "3.7.0"
sha2 = "0.10"
ureq = "3.5"
miniz_oxide = "0.9.1"
resvg = "0.48.1"
word-engine = { version = "0.1.0", path = "../../qalam/engine" }
slides-engine = { version = "0.1.0", path = "../../sard/engine" }
sheet-engine = { version = "0.1.0", path = "../../jadwal/engine" }
svg2pdf = "0.13"

[[bin]]
name = "saboura"
path = "src/main.rs"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"
