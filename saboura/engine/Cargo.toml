[package]
name = "saboura-engine"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "The board model of Saboura (سبورة): objects, geometry, hit testing and undo."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
