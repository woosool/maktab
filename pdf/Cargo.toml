[workspace]
resolver = "2"
members = ["engine", "app"]

[profile.dev.package."*"]
opt-level = 2
# Libraries without debug info keep build folders small (our own crates keep theirs).
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
incremental = false

[patch.crates-io]
epaint = { path = "../vendor/epaint" }
