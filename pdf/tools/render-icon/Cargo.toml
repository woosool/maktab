[package]
name = "render-icon"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Renders pdf/assets/icon.svg into the PNG, ICO and macOS iconset files (tool only, not part of the app)."
publish = false

# A tool of its own: not a member of the pdf workspace, so the app never builds resvg.
[workspace]

[dependencies]
resvg = "0.48"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
