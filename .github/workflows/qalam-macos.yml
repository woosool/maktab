# Build and publish Qalam for Apple silicon and Intel Macs.
name: Qalam macOS

on:
  push:
    branches: [main]
    tags: ["qalam-v*"]
    paths: ["qalam/**", "kit/**"]
  pull_request:
    paths: ["qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: qalam
      platform: macos
      name: Qalam
      slug: qalam
      release-tag: ${{ startsWith(github.ref, 'refs/tags/qalam-v') && github.ref_name || '' }}
