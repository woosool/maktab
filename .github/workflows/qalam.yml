# Build Qalam for Windows and Linux (x86_64, arm64). macOS has its own workflow.
name: Qalam

on:
  push:
    branches: [main]
    tags: ["qalam-v*"]
    paths: ["qalam/**", "kit/**"]
  pull_request:
    paths: ["qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: qalam
      platform: windows-linux
      name: Qalam
      slug: qalam
      release-tag: ${{ startsWith(github.ref, 'refs/tags/qalam-v') && github.ref_name || '' }}
