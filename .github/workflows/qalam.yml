# Build Qalam for macOS (Apple silicon, Intel), Windows and Linux (x86_64, arm64).
# Every push builds and uploads the packages as artifacts; a tag "qalam-v*" also publishes a
# GitHub release with the installers, update.json and SHA256SUMS.txt. The jobs live in build-app.yml.
name: Qalam

on:
  push:
    branches: [main]
    tags: ["qalam-v*"]
    paths: ["qalam/**", "kit/**"]
  pull_request:
    paths: ["qalam/**", "kit/**"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which platforms to build.
        required: true
        type: choice
        options: [all, macos]
        default: all

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: qalam
      platform: ${{ inputs.platform || 'all' }}
      name: Qalam
      slug: qalam
      release-tag: ${{ startsWith(github.ref, 'refs/tags/qalam-v') && github.ref_name || '' }}
