# Build Sard for macOS (Apple silicon, Intel), Windows and Linux (x86_64, arm64).
# Every push builds and uploads the packages as artifacts; a tag "sard-v*" also publishes a
# GitHub release with the installers, update.json and SHA256SUMS.txt. The jobs live in build-app.yml.
name: Sard

on:
  push:
    branches: [main]
    tags: ["sard-v*"]
    paths: ["sard/**", "qalam/**", "kit/**"]
  pull_request:
    paths: ["sard/**", "qalam/**", "kit/**"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which platforms to build.
        required: true
        type: choice
        options: [all, macos]
        default: all

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: sard
      platform: ${{ inputs.platform || 'all' }}
      name: Sard
      slug: sard
      release-tag: ${{ startsWith(github.ref, 'refs/tags/sard-v') && github.ref_name || '' }}
