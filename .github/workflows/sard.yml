# Build Sard for macOS (Apple silicon, Intel), Windows and Linux (x86_64, arm64).
# Every push builds and uploads the packages as artifacts; a tag "sard-v*" also publishes a
# GitHub release with the installers, update.json and SHA256SUMS.txt. The jobs live in build-app.yml.
name: Sard

on:
  push:
    branches: [main]
    tags: ["sard-v*"]
    paths: ["slides/**", "word/**", "kit/**", ".github/workflows/sard.yml", ".github/workflows/build-app.yml"]
  pull_request:
    paths: ["slides/**", "word/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: slides
      name: Sard
      slug: sard
      release-tag: ${{ startsWith(github.ref, 'refs/tags/sard-v') && github.ref_name || '' }}
