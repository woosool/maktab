# Build Sard for Windows and Linux (x86_64, arm64). macOS has its own workflow.
name: Sard

on:
  push:
    branches: [main]
    paths: ["sard/**", "qalam/**", "kit/**"]
  pull_request:
    paths: ["sard/**", "qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: sard
      platform: windows-linux
      slug: sard
