# Build and publish Sard for Apple silicon and Intel Macs.
name: Sard macOS

on:
  push:
    branches: [main]
    tags: ["sard-v*"]
    paths: ["sard/**", "qalam/**", "kit/**"]
  pull_request:
    paths: ["sard/**", "qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: sard
      platform: macos
      name: Sard
      slug: sard
      release-tag: ${{ startsWith(github.ref, 'refs/tags/sard-v') && github.ref_name || '' }}
