# Build and publish Sard for Apple silicon and Intel Macs.
name: Sard macOS

on:
  push:
    branches: [main]
    paths: ["sard/**", "qalam/**", "kit/**"]
  pull_request:
    paths: ["sard/**", "qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: sard
      platform: macos
      slug: sard
