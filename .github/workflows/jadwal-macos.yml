# Build and publish Jadwal for Apple silicon and Intel Macs.
name: Jadwal macOS

on:
  push:
    branches: [main]
    paths: ["jadwal/**", "sard/**", "qalam/**", "kit/**"]
  pull_request:
    paths: ["jadwal/**", "sard/**", "qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: jadwal
      platform: macos
      slug: jadwal
