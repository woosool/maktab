# Build Jadwal for Windows and Linux (x86_64, arm64). macOS has its own workflow.
name: Jadwal

on:
  push:
    branches: [main]
    tags: ["jadwal-v*"]
    paths: ["jadwal/**", "sard/**", "qalam/**", "kit/**"]
  pull_request:
    paths: ["jadwal/**", "sard/**", "qalam/**", "kit/**"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      dir: jadwal
      platform: windows-linux
      name: Jadwal
      slug: jadwal
      release-tag: ${{ startsWith(github.ref, 'refs/tags/jadwal-v') && github.ref_name || '' }}
